name: Scrape IT jobs
on:
  workflow_dispatch:
    inputs:
      init_profile_only:
        description: Utwórz lub sprawdź kartę Profil, bez scrapowania
        type: boolean
        default: false
      max_details:
        description: Maksymalna liczba szczegółów na źródło
        type: number
        default: 100
      write_sheets:
        description: Zapisz do Google Sheets (wymaga konfiguracji Google)
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: scrape-it-jobs
  cancel-in-progress: false
jobs:
  cadence:
    if: github.event_name == 'workflow_dispatch' || vars.SCRAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime, timezone
          days = (datetime.now(timezone.utc).date() - date(2026, 10, 27)).days
          due = os.environ['EVENT_NAME'] == 'workflow_dispatch' or days % 2 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"due={str(due).lower()}\n")
          PY
  scrape:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      INIT_PROFILE_ONLY: ${{ inputs.init_profile_only || false }}
      MAX_DETAILS: ${{ inputs.max_details || 100 }}
      WRITE_SHEETS: ${{ github.event_name == 'schedule' || inputs.write_sheets || inputs.init_profile_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Authenticate to Google
        if: env.WRITE_SHEETS == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Scrape
        shell: bash
        run: |
          args=()
          if [[ "$WRITE_SHEETS" == "true" ]]; then args+=(--write-sheets); fi
          if [[ "$INIT_PROFILE_ONLY" == "true" ]]; then args+=(--init-profile-only); fi
          python scraper.py --max-details "$MAX_DETAILS" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-results
          path: output/
          retention-days: 14
