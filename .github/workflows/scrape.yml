name: Scrape IT jobs
on:
  workflow_dispatch:
    inputs:
      max_details:
        description: Maksymalna liczba szczegółów na źródło
        type: number
        default: 100
      write_sheets:
        description: Zapisz do Google Sheets (wymaga konfiguracji Google)
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: scrape-it-jobs
  cancel-in-progress: false
jobs:
  scrape:
    if: github.event_name == 'workflow_dispatch' || vars.SCRAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
      MAX_DETAILS: ${{ inputs.max_details || 100 }}
      WRITE_SHEETS: ${{ github.event_name == 'schedule' || inputs.write_sheets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Authenticate to Google
        if: env.WRITE_SHEETS == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Scrape
        shell: bash
        run: |
          args=()
          if [[ "$WRITE_SHEETS" == "true" ]]; then args+=(--write-sheets); fi
          python scraper.py --max-details "$MAX_DETAILS" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-results
          path: output/
          retention-days: 14
